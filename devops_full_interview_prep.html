<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps Interview Prep — Complete Guide</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e17; --surface: #111827; --surface2: #1a2234;
  --border: #1e2d45; --text: #d1d5db; --text-bright: #f3f4f6;
  --muted: #6b7280;
  --accent1: #38bdf8; --accent2: #f59e0b; --accent3: #34d399;
  --accent4: #a78bfa; --accent5: #fb7185; --accent6: #2dd4bf;
  --accent7: #e879f9; --accent8: #f97316;
  --code-bg: #070b14;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.topbar{position:sticky;top:0;z-index:100;background:rgba(10,14,23,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.topbar-title{font-weight:700;color:var(--text-bright);font-size:13px;margin-right:10px;white-space:nowrap}
.nav-btn{padding:4px 11px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;font-family:inherit;white-space:nowrap}
.nav-btn:hover{border-color:var(--accent1);color:var(--accent1)}
.nav-btn.active{background:var(--accent1);color:#000;border-color:var(--accent1);font-weight:600}
.main{max-width:900px;margin:0 auto;padding:24px 20px 80px}
.area-header{margin-bottom:28px;padding-bottom:16px;border-bottom:2px solid var(--border)}
.area-number{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.area-title{font-size:24px;font-weight:700;color:var(--text-bright);margin-bottom:6px}
.area-what{font-size:13.5px;color:var(--muted);line-height:1.5}
.area-what em{color:var(--accent2);font-style:normal}
.topic{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden}
.topic-head{padding:13px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background .15s}
.topic-head:hover{background:var(--surface2)}
.topic-name{font-size:14px;font-weight:600;color:var(--text-bright)}
.topic-tag{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;letter-spacing:.5px;text-transform:uppercase}
.tag-must{background:rgba(251,113,133,0.15);color:var(--accent5)}
.tag-likely{background:rgba(245,158,11,0.15);color:var(--accent2)}
.tag-possible{background:rgba(56,189,248,0.15);color:var(--accent1)}
.chevron{color:var(--muted);transition:transform .2s;font-size:13px}
.topic.open .chevron{transform:rotate(90deg)}
.topic-body{display:none;padding:0 16px 16px}
.topic.open .topic-body{display:block}
.explanation{font-size:13px;color:var(--text);margin-bottom:12px;line-height:1.65}
.explanation strong{color:var(--text-bright)}
.code-wrap{position:relative;background:var(--code-bg);border:1px solid var(--border);border-radius:8px;margin:10px 0 12px;overflow:hidden}
.code-label{display:flex;justify-content:space-between;align-items:center;padding:4px 12px;background:rgba(30,45,69,0.5);border-bottom:1px solid var(--border)}
.code-lang{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.code-lang.py{color:var(--accent3)} .code-lang.bash{color:var(--accent2)} .code-lang.concept{color:var(--accent4)} .code-lang.yaml{color:var(--accent6)} .code-lang.hcl{color:var(--accent8)}
.copy-btn{background:none;border:1px solid var(--border);border-radius:4px;color:var(--muted);font-size:10px;padding:1px 7px;cursor:pointer;font-family:inherit}
.copy-btn:hover{color:var(--text-bright);border-color:var(--muted)}
pre{margin:0;padding:12px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.55;color:#e2e8f0}
.phrase{background:var(--surface2);border-left:3px solid var(--accent3);padding:9px 13px;border-radius:0 6px 6px 0;margin:10px 0;font-size:12.5px}
.phrase-label{font-size:10px;font-weight:700;color:var(--accent3);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.q-block{background:rgba(56,189,248,0.05);border:1px solid rgba(56,189,248,0.15);border-radius:8px;padding:11px 13px;margin:10px 0}
.q-label{font-size:10px;font-weight:700;color:var(--accent1);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.q-text{font-size:13px;color:var(--text-bright);font-weight:500;margin-bottom:5px}
.q-answer{font-size:12.5px;color:var(--text);line-height:1.6}
.progress-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,23,0.95);backdrop-filter:blur(8px);border-top:1px solid var(--border);padding:8px 20px;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);z-index:100}
.progress-track{flex:1;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent3);border-radius:2px;transition:width .3s}
.area{display:none} .area.visible{display:block}
</style>
</head>
<body>
<div class="topbar">
  <span class="topbar-title">🎯 Interview Prep</span>

</div>
<div class="main" id="main"></div>
<div class="progress-bar">
  <span id="prog-text">0 / 0 topics studied</span>
  <div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>

<script>
var AREAS = [
{
  number:'AREA 1',
  title:'Core Technology Knowledge',
  color:'var(--accent1)',
  what:'They want <em>stack depth</em> — not just &quot;I use AWS&quot; but how VPC peering works, how IAM policy evaluation works, what happens when an ALB receives a request.',
  topics:[
    {name:'AWS Architecture — Compute, Networking, Security',tag:'must',body:'<div class="explanation">Structure your answer in layers: <strong>Networking</strong> (VPC, subnets, SGs, NACLs, NAT, VPC endpoints), <strong>Compute</strong> (EC2, ECS/EKS, Lambda, ASGs), <strong>Security</strong> (IAM, KMS, Secrets Manager, WAF), <strong>Data</strong> (RDS, DynamoDB, S3, EFS), <strong>Integration</strong> (EventBridge, SNS, SQS, Step Functions).</div><div class="q-block"><div class="q-label">Likely Question</div><div class="q-text">Walk me through the network path of a request hitting your application</div><div class="q-answer">User → Route53 DNS → CloudFront (edge cache + WAF) → ALB (TLS termination, listener rules) → Target Group → EC2/ECS in private subnet → app processes request → if DB needed, goes to RDS in private subnet via security group rules. All traffic logged via VPC Flow Logs and CloudWatch.</div></div><div class="q-block"><div class="q-label">Likely Question</div><div class="q-text">How does IAM policy evaluation work?</div><div class="q-answer">Default deny → evaluate all applicable policies → <strong>explicit deny always wins</strong> → if no explicit deny, check for explicit allow across identity-based, resource-based, permission boundaries, SCPs, and session policies → if no explicit allow, implicit deny.</div></div><div class="phrase"><div class="phrase-label">Say this</div>In our current project we follow least-privilege — I recently remediated overly permissive security groups on Directory Service and rotated IAM access keys for Trend Micro and SES integrations.</div>'},
{name:'Linux Internals — Processes, Filesystem, Networking',tag:'must',body:'<div class="code-wrap"><div class="code-label"><span class="code-lang concept">KEY CONCEPTS</span></div><pre>Process lifecycle:  fork() → exec() → wait()/exit()\nSignals:            SIGTERM (graceful) vs SIGKILL (force, can\'t catch)\nFile descriptors:   0=stdin, 1=stdout, 2=stderr  |  redirect: cmd > file 2>&1\nSystemd:            systemctl start/stop/enable/status\n                    journalctl -u service -f (follow logs)\nFilesystem:         /proc (process info), /sys (kernel params)\n                    df -h (disk), du -sh (dir size), lsof (open files)\nNetworking:         ss -tlnp (listening ports), ip addr, iptables/nftables\nPermissions:        chmod 755 (rwxr-xr-x), chown user:group\nLoad avg:           uptime → 1/5/15 min averages → > num_cpus = overloaded</pre></div><div class="q-block"><div class="q-label">Likely Question</div><div class="q-text">A process is consuming too much memory. How do you investigate?</div><div class="q-answer">top/htop to identify PID → check /proc/PID/status for VmRSS → /proc/PID/smaps for detailed mapping → strace -p PID for syscall tracing → check dmesg/journalctl for OOM messages → for Java: jmap heap dump, for Python: tracemalloc.</div></div>'},
{name:'CI/CD Pipelines — Architecture & Strategy',tag:'must',body:'<div class="code-wrap"><div class="code-label"><span class="code-lang concept">PIPELINE ANATOMY</span></div><pre>Source:     Git push / PR merge → webhook triggers pipeline\nBuild:      Compile, docker build, npm install\nTest:       Unit tests, integration tests, linting\nSecurity:   SAST, dependency scan, container scan\nArtifact:   Push image to ECR/registry, version tag\nDeploy:     Blue/Green | Canary | Rolling\nVerify:     Smoke tests, health checks, rollback if failed\n\nDeployment strategies:\n  Blue/Green:  Two identical envs, switch traffic atomically. Safe rollback.\n  Canary:      5% traffic → new version, monitor, gradual increase. Early detection.\n  Rolling:     Replace pods/instances one by one (K8s default). No extra infra.\n\nKey concepts:\n  - Idempotent deploys (run twice = same result)\n  - Immutable artifacts (build once, deploy to all envs)\n  - GitOps: desired state in git, reconciled by ArgoCD/Flux\n  - Feature flags: decouple deploy from release</pre></div><div class="phrase"><div class="phrase-label">Say this</div>I prefer pipelines that are idempotent with automated rollback. We push to ECR with vulnerability scanning, deploy via Terraform, and verify with health checks before cutting traffic.</div>'},
{name:'Networking Fundamentals — DNS, HTTP, TLS, TCP/IP',tag:'likely',body:'<div class="code-wrap"><div class="code-label"><span class="code-lang concept">MUST KNOW</span></div><pre>DNS resolution: Browser cache → OS cache → resolver → root → TLD → authoritative\n               A (IPv4), AAAA (IPv6), CNAME (alias), MX (mail), NS, SOA\n\nTLS handshake:  Client Hello → Server Hello + cert → verify cert chain →\n                key exchange (ECDHE) → symmetric encryption\n                TLS 1.3: 1-RTT (faster than 1.2\'s 2-RTT)\n\nHTTP methods:   GET (read), POST (create), PUT (full update), PATCH (partial), DELETE\nStatus codes:   2xx success, 3xx redirect, 4xx client error, 5xx server error\nKey headers:    Content-Type, Authorization, Cache-Control, X-Request-ID\n\nTCP vs UDP:     TCP: reliable, ordered, 3-way handshake (SYN→SYN-ACK→ACK)\n                UDP: fast, no guarantee (DNS, video streaming, gaming)\n\nLoad balancing: L4 (TCP, fast) vs L7 (HTTP, content-based routing)\n                Algorithms: round-robin, least-connections, IP hash</pre></div>'}
  ]
},
{
  number:'AREA 2',
  title:'Coding',
  color:'var(--accent3)',
  what:'They said: <em>realistic production challenge, algorithmic problem, business logic, design pattern</em>. Plus discuss <em>complexity, testability, maintainability</em>.',
  topics:[
    {name:'File & Log Processing',tag:'must',body:'<div class="explanation">The #1 most asked DevOps coding question. Parse a log file, extract/count/aggregate.</div><div class="code-wrap"><div class="code-label"><span class="code-lang py">PYTHON</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre>from collections import Counter\nimport re\n\ndef parse_log(filepath: str, top_n: int = 10) -> list[tuple[str, int]]:\n    error_pattern = re.compile(\n        r\'\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2} ERROR \\[(.+?)\\] (.+)\'\n    )\n    errors = Counter()\n    with open(filepath, \'r\') as f:\n        for line in f:\n            match = error_pattern.search(line)\n            if match:\n                source, message = match.groups()\n                errors[message] += 1\n    return errors.most_common(top_n)\n\nfor msg, count in parse_log("/var/log/app.log"):\n    print(f"{count:>5} | {msg}")</pre></div><div class="code-wrap"><div class="code-label"><span class="code-lang bash">BASH EQUIVALENT</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre>grep "ERROR" /var/log/app.log | awk -F\'] \' \'{print $2}\' | sort | uniq -c | sort -rn | head -10</pre></div><div class="phrase"><div class="phrase-label">Say this</div>This streams line-by-line so memory is O(1) regardless of file size. Counter uses a hash map internally so lookups are O(1). Overall O(n) for n lines. For testability, I\'d inject the file path and use pytest fixtures with sample log content.</div>'},
{name:'JSON/YAML Config Manipulation',tag:'must',body:'<div class="code-wrap"><div class="code-label"><span class="code-lang py">PYTHON</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre>import json\nimport yaml\nfrom pathlib import Path\nfrom copy import deepcopy\n\ndef update_config(filepath: str, updates: dict) -> dict:\n    path = Path(filepath)\n    with open(path, \'r\') as f:\n        if path.suffix in (\'.yaml\', \'.yml\'):\n            config = yaml.safe_load(f)\n        else:\n            config = json.load(f)\n\n    original = deepcopy(config)  # for diff/rollback\n\n    def deep_update(base, updates):\n        for key, value in updates.items():\n            if isinstance(value, dict) and isinstance(base.get(key), dict):\n                deep_update(base[key], value)\n            else:\n                base[key] = value\n\n    deep_update(config, updates)\n    with open(path, \'w\') as f:\n        if path.suffix in (\'.yaml\', \'.yml\'):\n            yaml.dump(config, f, default_flow_style=False)\n        else:\n            json.dump(config, f, indent=2)\n    return config</pre></div><div class="phrase"><div class="phrase-label">Say this</div>I used deep_update for nested keys without overwriting siblings. In production I\'d write to a temp file first, then atomic rename, to prevent corruption.</div>'},
{name:'API Health Checker with Retry Logic',tag:'must',body:'<div class="code-wrap"><div class="code-label"><span class="code-lang py">PYTHON</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre>import requests, time\nfrom dataclasses import dataclass\n\n@dataclass\nclass HealthResult:\n    name: str\n    url: str\n    healthy: bool\n    status_code: int | None = None\n    response_time_ms: float | None = None\n    error: str | None = None\n\ndef check_service(name, url, timeout=5, retries=3):\n    for attempt in range(retries):\n        try:\n            start = time.time()\n            resp = requests.get(url, timeout=timeout)\n            elapsed = (time.time() - start) * 1000\n            return HealthResult(name=name, url=url,\n                healthy=resp.status_code == 200,\n                status_code=resp.status_code,\n                response_time_ms=round(elapsed, 1))\n        except requests.RequestException as e:\n            if attempt == retries - 1:\n                return HealthResult(name=name, url=url, healthy=False, error=str(e))\n            time.sleep(2 ** attempt)  # exponential backoff</pre></div><div class="phrase"><div class="phrase-label">Say this</div>I used a dataclass for structured results — typed and self-documenting. Exponential backoff prevents hammering a struggling service. I\'d test with pytest + responses library to mock HTTP calls.</div>'},
{name:'Data Structures — When to Use What',tag:'must',body:'<div class="code-wrap"><div class="code-label"><span class="code-lang py">PYTHON</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre># ── FIND DUPLICATES ── O(n) using set\ndef find_duplicates(items):\n    seen = set()\n    dupes = []\n    for item in items:\n        if item in seen:      # set lookup = O(1)\n            dupes.append(item)\n        else:\n            seen.add(item)\n    return dupes\n\n# ── TWO SUM ── O(n) using dict\ndef two_sum(nums, target):\n    seen = {}  # value → index\n    for i, num in enumerate(nums):\n        complement = target - num\n        if complement in seen:\n            return (seen[complement], i)\n        seen[num] = i\n    return None\n\n# ── GROUP BY KEY ──\nfrom collections import defaultdict\ndef group_by_region(servers):\n    by_region = defaultdict(list)\n    for s in servers:\n        by_region[s["region"]].append(s["name"])\n    return dict(by_region)\n\n# ── SORT COMPLEX DATA ──\nsorted(deploys, key=lambda d: d["time"], reverse=True)\nfailed = [d for d in deploys if d["status"] == "failed"]</pre></div><div class="q-block"><div class="q-label">Complexity Cheat Sheet</div><div class="q-text">Know these by heart:</div><div class="q-answer"><strong>list</strong>: append O(1), search O(n), index O(1)<br><strong>dict/set</strong>: get/set/in O(1) average<br><strong>sorted()</strong>: O(n log n) — Timsort<br><strong>heapq</strong>: push/pop O(log n) — top K problems<br><strong>deque</strong>: append/pop both ends O(1) — BFS</div></div>'},
{name:'Design Patterns for DevOps',tag:'likely',body:'<div class="code-wrap"><div class="code-label"><span class="code-lang py">SINGLETON — Config / DB Connection</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre>class Config:\n    _instance = None\n    def __new__(cls):\n        if cls._instance is None:\n            cls._instance = super().__new__(cls)\n            cls._instance.data = {}  # load config here\n        return cls._instance</pre></div><div class="code-wrap"><div class="code-label"><span class="code-lang py">STRATEGY — Pluggable Deploy Methods</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre>from abc import ABC, abstractmethod\n\nclass DeployStrategy(ABC):\n    @abstractmethod\n    def deploy(self, version: str): ...\n\nclass BlueGreenDeploy(DeployStrategy):\n    def deploy(self, version):\n        print(f"Blue/Green: switching to {version}")\n\nclass CanaryDeploy(DeployStrategy):\n    def deploy(self, version):\n        print(f"Canary: 5% traffic to {version}")\n\nclass Deployer:\n    def __init__(self, strategy: DeployStrategy):\n        self.strategy = strategy\n    def run(self, version):\n        self.strategy.deploy(version)</pre></div><div class="code-wrap"><div class="code-label"><span class="code-lang py">DECORATOR — Retry Any Function</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre>import functools, time\n\ndef retry(max_attempts=3, backoff=2):\n    def decorator(func):\n        @functools.wraps(func)\n        def wrapper(*args, **kwargs):\n            for attempt in range(max_attempts):\n                try:\n                    return func(*args, **kwargs)\n                except Exception as e:\n                    if attempt == max_attempts - 1: raise\n                    time.sleep(backoff ** attempt)\n        return wrapper\n    return decorator\n\n@retry(max_attempts=3)\ndef call_api(url):\n    return requests.get(url, timeout=5)</pre></div>'},
{name:'Testing & Code Quality',tag:'must',body:'<div class="code-wrap"><div class="code-label"><span class="code-lang py">PYTEST</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre>import pytest\nfrom unittest.mock import patch, MagicMock\n\n@pytest.fixture\ndef sample_log(tmp_path):\n    log = tmp_path / "test.log"\n    log.write_text(\n        "2026-01-01 10:00:00 ERROR [api] Connection timeout\\n"\n        "2026-01-01 10:00:01 INFO [api] Request OK\\n"\n        "2026-01-01 10:00:02 ERROR [api] Connection timeout\\n"\n    )\n    return str(log)\n\ndef test_parse_log_counts(sample_log):\n    results = parse_log(sample_log)\n    assert results[0] == ("Connection timeout", 2)\n\ndef test_parse_log_empty(tmp_path):\n    empty = tmp_path / "empty.log"\n    empty.write_text("")\n    assert parse_log(str(empty)) == []\n\n@patch(\'requests.get\')\ndef test_health_check_timeout(mock_get):\n    mock_get.side_effect = requests.exceptions.Timeout\n    result = check_service("api", "http://fake.com", retries=1)\n    assert result.healthy is False</pre></div><div class="phrase"><div class="phrase-label">Say this</div>I test three cases: happy path, edge cases (empty input, None), and failure modes (timeouts, bad data). I mock external deps so tests are fast and deterministic.</div>'},
{name:'Bash Scripting Patterns',tag:'must',body:'<div class="code-wrap"><div class="code-label"><span class="code-lang bash">BASH ESSENTIALS</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre>#!/bin/bash\nset -euo pipefail  # ALWAYS START WITH THIS\n\nENV="\\${1:-staging}"\necho "Deploying to $ENV"\n\nif [[ "$ENV" == "prod" ]]; then\n    echo "Production deploy"\nelif [[ "$ENV" == "staging" ]]; then\n    echo "Staging deploy"\nelse\n    echo "Unknown env: $ENV" >&2; exit 1\nfi\n\nSERVERS=("web01" "web02" "db01")\nfor server in "\\${SERVERS[@]}"; do\n    echo "Checking $server..."\n    ssh "$server" "uptime" || echo "WARN: $server unreachable"\ndone\n\ncheck_disk() {\n    local threshold="\\${1:-80}"\n    local usage=$(df / | tail -1 | awk \'{print $5}\' | tr -d \'%\')\n    if (( usage > threshold )); then\n        echo "ALERT: Disk at \\${usage}%" >&2; return 1\n    fi\n    echo "Disk OK: \\${usage}%"\n}\n\nwhile IFS= read -r line; do\n    echo "Processing: $line"\ndone < input.txt\n\nif command -v docker &>/dev/null; then echo "Docker installed"; fi</pre></div><div class="phrase"><div class="phrase-label">Say this</div>I always start bash scripts with set -euo pipefail to fail fast. I use shellcheck for linting. For anything complex, I switch to Python.</div>'}
  ]
},
{
  number:'AREA 3',
  title:'Computer Science Fundamentals',
  color:'var(--accent4)',
  what:'They said: <em>design a simple algorithm, internals of data structures, code performance improvement</em>. They want to know WHY your code is fast or slow.',
  topics:[
    {name:'Big-O Complexity',tag:'must',body:'<div class="code-wrap"><div class="code-label"><span class="code-lang concept">BIG-O REFERENCE</span></div><pre>O(1)       Constant    dict/set lookup, array index\nO(log n)   Logarithmic Binary search, balanced BST\nO(n)       Linear      Single loop, file read\nO(n log n) Linearithmic sorted()\nO(n²)      Quadratic   Nested loops — use a dict instead\nO(2ⁿ)      Exponential Recursion without memoization\n\nRULES OF THUMB:\n- "Check if X exists" → dict/set O(1), not list scan O(n)\n- "Nested loops" → probably O(n²), look for dict/set to reduce\n- "Sorting first" → O(n log n), usually fine\n- "Recursion" → check for overlapping subproblems → memoize\n\nSPACE: dict of n items → O(n) | stream file → O(1) | recursion → O(depth)</pre></div><div class="q-block"><div class="q-label">Common Question</div><div class="q-text">How would you improve performance of this code?</div><div class="q-answer">1. Identify bottleneck (nested loops, repeated searches). 2. Replace O(n) lookups with O(1) dict/set. 3. Sort + binary search. 4. I/O bound → async/concurrent. CPU bound → caching, batching, better algorithm.</div></div>'},
{name:'How Hash Maps (dicts) Work',tag:'likely',body:'<div class="code-wrap"><div class="code-label"><span class="code-lang concept">HASH MAP INTERNALS</span></div><pre>How dict works:\n1. Key → hash function → integer hash\n2. Hash → modulo table_size → index (bucket)\n3. Store (key, value) at that index\n4. Collision → open addressing (Python) or chaining (Java)\n\nWhy O(1) average:  hash + modulo + index = constant\nWhy O(n) worst:    all keys same bucket (extremely rare)\n\nPython specifics:\n- dict preserves insertion order (since 3.7)\n- Resizes at ~2/3 load factor\n- set = dict without values (same O(1) lookup)</pre></div>'},
{name:'BFS & DFS (DevOps-relevant)',tag:'possible',body:'<div class="code-wrap"><div class="code-label"><span class="code-lang py">BFS & DFS</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre>from collections import deque\n\ndef bfs(graph, start):\n    visited = set()\n    queue = deque([start])\n    visited.add(start)\n    result = []\n    while queue:\n        node = queue.popleft()\n        result.append(node)\n        for neighbor in graph[node]:\n            if neighbor not in visited:\n                visited.add(neighbor)\n                queue.append(neighbor)\n    return result\n\n# DevOps: service dependency graph\nservices = {\n    "web": ["api", "cache"],\n    "api": ["database", "auth"],\n    "auth": ["database"], "cache": [], "database": [],\n}\nprint(bfs(services, "web"))  # [\'web\', \'api\', \'cache\', \'database\', \'auth\']</pre></div>'},
{name:'Recursion & Memoization',tag:'possible',body:'<div class="code-wrap"><div class="code-label"><span class="code-lang py">PYTHON</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre>from functools import lru_cache\n\n# BAD: O(2^n)\ndef fib_bad(n):\n    if n <= 1: return n\n    return fib_bad(n-1) + fib_bad(n-2)\n\n# GOOD: O(n) — memoized\n@lru_cache(maxsize=None)\ndef fib(n):\n    if n <= 1: return n\n    return fib(n-1) + fib(n-2)\n\n# BEST for interviews: iterative O(n) time, O(1) space\ndef fib_iter(n):\n    a, b = 0, 1\n    for _ in range(n):\n        a, b = b, a + b\n    return a</pre></div><div class="phrase"><div class="phrase-label">Say this</div>The naive version is O(2ⁿ) due to overlapping subproblems. lru_cache makes it O(n). For production I\'d use iterative — no recursion depth limit and O(1) space.</div>'}
  ]
},
{
  number:'AREA 4',
  title:'Frameworks & Tools',
  color:'var(--accent2)',
  what:'They said: <em>experience with specific frameworks and tools, their architecture, internals, components and APIs. Apply framework knowledge to solve specific business needs.</em>',
  topics:[
    {name:'Terraform — State, Modules, HCL',tag:'must',body:'<div class="code-wrap"><div class="code-label"><span class="code-lang concept">TERRAFORM INTERNALS</span></div><pre>LIFECYCLE:  init → plan → apply → destroy\nSTATE:      terraform.tfstate (JSON) — remote in S3 + DynamoDB lock\nPROVIDERS:  Plugins for cloud APIs, version-locked in .terraform.lock.hcl\nDAG:        Dependency graph, parallel where possible, depends_on for explicit\n\nState commands:\n  terraform state list / show / mv / rm / import\n  terraform apply -refresh-only    # sync state with reality\n\nKey HCL:\n  variable  — inputs with type + validation\n  locals    — computed values\n  data      — read existing resources\n  output    — expose values between modules\n  module    — reusable infra packages\n  for_each  — stable keys (preferred over count)</pre></div><div class="code-wrap"><div class="code-label"><span class="code-lang hcl">TERRAFORM — WRITE FROM MEMORY</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre>variable "environment" {\n  type = string\n  validation {\n    condition     = contains(["dev", "staging", "prod"], var.environment)\n    error_message = "Must be dev, staging, or prod."\n  }\n}\n\nlocals {\n  name_prefix = "myapp-\\${var.environment}"\n  common_tags = { Environment = var.environment, ManagedBy = "terraform" }\n}\n\nresource "aws_instance" "web" {\n  count         = var.instance_count\n  ami           = data.aws_ami.amazon_linux.id\n  instance_type = "t3.medium"\n  tags = merge(local.common_tags, { Name = "\\${local.name_prefix}-web" })\n\n  lifecycle { create_before_destroy = true }\n}\n\nterraform {\n  backend "s3" {\n    bucket = "mycompany-tf-state"\n    key    = "envs/prod/terraform.tfstate"\n    region = "eu-central-1"\n    dynamodb_table = "terraform-locks"\n    encrypt = true\n  }\n}</pre></div><div class="q-block"><div class="q-label">Likely Question</div><div class="q-text">count vs for_each?</div><div class="q-answer"><strong>count</strong>: numeric, items shift on delete (items 3-5 recreated if 2 removed). <strong>for_each</strong>: map/set keys, stable — deleting one doesn\'t affect others. Rule: for_each for anything you might add/remove. count only for on/off (count = var.enabled ? 1 : 0).</div></div><div class="q-block"><div class="q-label">Likely Question</div><div class="q-text">How do you handle secrets in Terraform?</div><div class="q-answer">Never in tfvars/state plain text. Use Secrets Manager/SSM with data sources. Mark variables sensitive. Encrypt state (S3 SSE-KMS). Vault provider for dynamic secrets. CI: inject via env vars, never commit.</div></div>'},
{name:'Ansible — Playbooks, Roles, Idempotency',tag:'must',body:'<div class="code-wrap"><div class="code-label"><span class="code-lang concept">ANSIBLE ARCHITECTURE</span></div><pre>Agentless — SSH (Linux) / WinRM (Windows)\nControl node → push Python modules → execute → return JSON\n\nInventory:  Static YAML/INI or Dynamic (aws_ec2 plugin)\nPlaybook:   YAML list of plays → tasks → modules\nRole:       tasks/ handlers/ templates/ vars/ defaults/ files/\nFacts:      Auto-gathered system info (ansible_os_family, etc.)\nHandlers:   Triggered by notify, run once at end\nVault:      ansible-vault encrypt/decrypt sensitive vars\n\nIDEMPOTENCY IS KEY:\n  GOOD: apt: name=nginx state=present  (only if missing)\n  BAD:  shell: apt-get install nginx   (runs every time)</pre></div><div class="code-wrap"><div class="code-label"><span class="code-lang yaml">PLAYBOOK — WRITE FROM MEMORY</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre>---\n- name: Configure web servers\n  hosts: webservers\n  become: yes\n  vars:\n    app_port: 8000\n  tasks:\n    - name: Install packages\n      apt:\n        name: [nginx, python3-pip, certbot]\n        state: present\n        update_cache: yes\n    - name: Deploy nginx config\n      template:\n        src: templates/nginx.conf.j2\n        dest: /etc/nginx/sites-available/default\n      notify: Restart nginx\n    - name: Ensure nginx running\n      service: name=nginx state=started enabled=yes\n  handlers:\n    - name: Restart nginx\n      service: name=nginx state=restarted</pre></div><div class="code-wrap"><div class="code-label"><span class="code-lang bash">ANSIBLE CLI</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre>ansible-playbook site.yml -i inventory/prod/hosts.yml\nansible-playbook site.yml --limit web01 --tags "deploy"\nansible-playbook site.yml --check --diff       # dry run\nansible webservers -m ping                      # ad-hoc\nansible webservers -m shell -a "uptime"\nansible-vault encrypt secrets.yml</pre></div><div class="q-block"><div class="q-label">Likely Question</div><div class="q-text">Ansible vs Terraform?</div><div class="q-answer"><strong>Terraform</strong>: infrastructure provisioning (VPCs, EC2, RDS). Declarative, state-tracked. <strong>Ansible</strong>: configuration management (install packages, deploy configs). Procedural. <strong>Together</strong>: Terraform creates infra, Ansible configures it. Or Terraform + user_data for immutable infrastructure.</div></div>'},
{name:'CI/CD — GitHub Actions, Jenkins',tag:'must',body:'<div class="code-wrap"><div class="code-label"><span class="code-lang yaml">GITHUB ACTIONS — WRITE FROM MEMORY</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre>name: Build & Deploy\non:\n  push: { branches: [main] }\n  pull_request: { branches: [main] }\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with: { python-version: \'3.11\' }\n      - run: pip install -r requirements.txt\n      - run: pytest tests/ -v --cov=app\n\n  build-and-push:\n    needs: test\n    if: github.ref == \'refs/heads/main\'\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: aws-actions/configure-aws-credentials@v4\n        with:\n          role-to-assume: arn:aws:iam::role/github-role\n          aws-region: eu-central-1\n      - uses: aws-actions/amazon-ecr-login@v2\n      - run: |\n          docker build -t $REGISTRY/myapp:$GITHUB_SHA .\n          docker push $REGISTRY/myapp:$GITHUB_SHA\n\n  deploy:\n    needs: build-and-push\n    environment: production\n    steps:\n      - run: aws ecs update-service --cluster prod --service myapp --force-new-deployment</pre></div><div class="q-block"><div class="q-label">Likely Question</div><div class="q-text">How do you handle secrets in CI/CD?</div><div class="q-answer">GitHub: Secrets or OIDC role assumption (no static keys). Jenkins: Credentials plugin + withCredentials(). Best: OIDC to assume IAM role — zero long-lived credentials. App secrets from Secrets Manager at deploy time.</div></div>'},
{name:'Git — Internals & Commands',tag:'must',body:'<div class="code-wrap"><div class="code-label"><span class="code-lang bash">GIT — KNOW COLD</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre># Internals: blob (content) → tree (directory) → commit (snapshot)\n# Branches = lightweight pointers (40-char SHA)\n\ngit switch -c feature/new-api       # create + switch\ngit rebase main                     # linear history\ngit rebase -i HEAD~3                # interactive: squash, edit, drop\ngit reset --soft HEAD~1             # undo commit, keep staged\ngit reset --hard HEAD~1             # undo commit, DESTROY changes\ngit revert abc123                   # safe undo (new commit)\ngit stash / git stash pop           # save/restore work\ngit cherry-pick abc123              # apply specific commit\ngit reflog                          # recover "lost" commits\ngit bisect start                    # binary search for bug\ngit log --oneline --graph --all\ngit blame path/to/file</pre></div><div class="q-block"><div class="q-label">Likely Question</div><div class="q-text">You committed secrets to git. What do you do?</div><div class="q-answer">1. <strong>Rotate the secret IMMEDIATELY</strong> — it\'s compromised even if you delete it. 2. Remove from history: git-filter-repo. 3. Force push. 4. All collaborators re-clone. 5. Prevention: .gitignore, pre-commit hooks (detect-secrets, gitleaks).</div></div>'},
{name:'Networking Tools & Debugging',tag:'likely',body:'<div class="code-wrap"><div class="code-label"><span class="code-lang bash">NETWORK DEBUGGING COMMANDS</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre># DNS\ndig example.com          dig +short example.com\nnslookup example.com     host example.com\n\n# Connectivity\nping -c 4 10.0.1.10     traceroute 10.0.1.10\nnc -zv 10.0.1.10 443    telnet 10.0.1.10 443\ncurl -v https://api.example.com\ncurl -s -o /dev/null -w "%{http_code}" https://api.example.com/health\n\n# Ports & connections\nss -tlnp                 # TCP listening with process\nlsof -i :8080           # what\'s using port 8080\nnetstat -tulpn           # older but still common\n\n# Traffic capture\ntcpdump -i eth0 port 443\ntcpdump -i any -w capture.pcap    # save for Wireshark\n\n# Config\nip addr show    ip route show    cat /etc/resolv.conf\niptables -L -n -v                # firewall rules</pre></div><div class="q-block"><div class="q-label">Likely Question</div><div class="q-text">Service A can\'t connect to Service B on port 5432. Debug?</div><div class="q-answer">Layered: 1. DNS resolution 2. nc -zv to test port 3. Security groups (inbound+outbound) 4. NACLs (stateless) 5. Route tables 6. Is B listening? (ss -tlnp) 7. Host firewall. Work outside-in.</div></div>'}
  ]
},
{
